<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f4f4f5;
  color: #18181b;
  min-height: 100vh;
}

.sync-bar {
  font-size: 12px;
  color: #a1a1aa;
  text-align: right;
  padding: 8px 20px 0;
}
.sync-bar.syncing { color: #18181b; }
.sync-bar.error { color: #dc2626; }

.main { padding: 20px; }

.month-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.month-header h2 {
  font-size: 16px;
  font-weight: 500;
  color: #18181b;
  text-transform: capitalize;
  flex: 1;
}
.month-nav {
  background: none;
  border: 1px solid #e4e4e7;
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 14px;
  color: #71717a;
  font-family: inherit;
  transition: background 0.15s;
}
.month-nav:hover { background: #f4f4f5; }

.legend {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: #71717a;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex-shrink: 0;
}
.dot-shame      { background: #fee2e2; border: 1px solid #fca5a5; }
.dot-behaviour  { background: #dcfce7; border: 1px solid #86efac; }
.dot-neutral    { background: #e4e4e7; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.day-label {
  text-align: center;
  font-size: 11px;
  color: #71717a;
  padding: 4px 0;
  font-weight: 500;
}
.day {
  background: #ffffff;
  border: 1px solid #e4e4e7;
  border-radius: 8px;
  padding: 8px;
  min-height: 110px;
  transition: border-color 0.15s, background 0.15s;
}
.day:hover { border-color: #a1a1aa; }
.day.today { border-color: #18181b; }
.day.drag-over {
  background: #f4f4f5;
  border-color: #18181b;
}
.day-num {
  font-size: 12px;
  color: #71717a;
  font-weight: 500;
  margin-bottom: 3px;
}
.day.today .day-num { color: #000; font-weight: 700; }

/* CHIPS */
.ev-chip {
  border-radius: 4px;
  font-size: 11px;
  padding: 3px 6px;
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow: hidden;
  cursor: grab;
  user-select: none;
  transition: opacity 0.15s, transform 0.1s;
}
.ev-chip:active { cursor: grabbing; transform: scale(0.97); }
.ev-chip.dragging { opacity: 0.4; }

.chip-shame     { background: #fee2e2; color: #991b1b; }
.chip-behaviour { background: #dcfce7; color: #166534; }
.chip-neutral   { background: #e4e4e7; color: #18181b; }

.ev-inner {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow: hidden;
  flex: 1;
}
.ev-inner span.time { font-weight: 700; flex-shrink: 0; }
.ev-inner span.label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ev-del {
  flex-shrink: 0;
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  opacity: 0.6;
}
.ev-del:hover { opacity: 1; color: #991b1b !important; }

.add-ev-btn {
  display: block;
  width: 100%;
  margin-top: 4px;
  font-size: 10px;
  color: #a1a1aa;
  background: none;
  border: none;
  text-align: left;
  cursor: pointer;
  padding: 0;
  font-family: inherit;
}
.add-ev-btn:hover { color: #18181b; }

/* MODAL */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal {
  background: #ffffff;
  border-radius: 12px;
  border: 1px solid #e4e4e7;
  padding: 20px;
  width: 300px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
.modal h3 { font-size: 15px; font-weight: 500; margin-bottom: 14px; color: #18181b; }
.modal label { font-size: 12px; color: #71717a; display: block; margin-bottom: 4px; }
.modal input {
  width: 100%;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid #e4e4e7;
  background: #f4f4f5;
  color: #18181b;
  font-size: 14px;
  outline: none;
  margin-bottom: 12px;
  font-family: inherit;
  transition: border-color 0.15s;
}
.modal input:focus { border-color: #18181b; }

.cat-picker {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.cat-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: 7px;
  border: 2px solid transparent;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  transition: border-color 0.15s, transform 0.1s;
}
.cat-btn:active { transform: scale(0.96); }
.cat-btn.c-neutral   { background: #e4e4e7; color: #18181b; }
.cat-btn.c-shame     { background: #fee2e2; color: #991b1b; }
.cat-btn.c-behaviour { background: #dcfce7; color: #166534; }
.cat-btn.selected    { border-color: #18181b; }

.modal-btns { display: flex; gap: 8px; }
.modal-btns button {
  flex: 1; padding: 9px;
  border-radius: 8px; border: none;
  font-size: 13px; cursor: pointer;
  font-family: inherit; transition: background 0.15s;
}
.btn-save { background: #18181b; color: white; }
.btn-save:hover { background: #000; }
.btn-cancel { background: #f4f4f5; color: #71717a; border: 1px solid #e4e4e7 !important; }
.btn-cancel:hover { background: #e4e4e7; }

@media (max-width: 700px) {
  .cal-grid { gap: 3px; }
  .day { min-height: 70px; padding: 5px; }
}
</style>
</head>
<body>

<div id="syncBar" class="sync-bar">Connexion…</div>

<div class="main">
  <div class="month-header">
    <button class="month-nav" onclick="changeMonth(-1)">&#8249;</button>
    <h2 id="monthTitle"></h2>
    <button class="month-nav" onclick="changeMonth(1)">&#8250;</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-neutral"></div>Neutre</div>
    <div class="legend-item"><div class="legend-dot dot-shame"></div>Honte</div>
    <div class="legend-item"><div class="legend-dot dot-behaviour"></div>Comportement</div>
  </div>
  <div class="cal-grid" id="dayLabels"></div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- MODAL AJOUT -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">Ajouter une entrée</h3>
    <label>Description</label>
    <input id="evInput" placeholder="Décris l'événement…" onkeydown="if(event.key==='Enter')saveEvent()">
    <label>Horaire <span style="color:#a1a1aa;font-weight:400">(optionnel)</span></label>
    <input id="evTime" type="time" style="margin-bottom:12px;">
    <label>Catégorie</label>
    <div class="cat-picker">
      <button class="cat-btn c-neutral selected"   onclick="selectCat('neutral')"   id="c-neutral">Neutre</button>
      <button class="cat-btn c-shame"              onclick="selectCat('shame')"     id="c-shame">Honte</button>
      <button class="cat-btn c-behaviour"          onclick="selectCat('behaviour')" id="c-behaviour">Comportement</button>
    </div>
    <div class="modal-btns">
      <button class="btn-save" onclick="saveEvent()">Enregistrer</button>
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
    </div>
  </div>
</div>

<!-- MODAL ÉDITION -->
<div class="overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Modifier l'entrée</h3>
    <label>Description</label>
    <input id="editEvInput" placeholder="Décris l'événement…">
    <label>Horaire <span style="color:#a1a1aa;font-weight:400">(optionnel)</span></label>
    <input id="editEvTime" type="time" style="margin-bottom:12px;">
    <label>Catégorie</label>
    <div class="cat-picker">
      <button class="cat-btn c-neutral"   onclick="selectEditCat('neutral')"   id="ec-neutral">Neutre</button>
      <button class="cat-btn c-shame"     onclick="selectEditCat('shame')"     id="ec-shame">Honte</button>
      <button class="cat-btn c-behaviour" onclick="selectEditCat('behaviour')" id="ec-behaviour">Comportement</button>
    </div>
    <div class="modal-btns">
      <button class="btn-save" onclick="saveEdit()">Enregistrer</button>
      <button class="btn-cancel" onclick="closeEdit()">Annuler</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDmv1DwegzM-Fnp9dbvxBSe91jMVvWkTZ8",
  authDomain: "alcal-5a395.firebaseapp.com",
  projectId: "alcal-5a395",
  storageBucket: "alcal-5a395.firebasestorage.app",
  messagingSenderId: "861363544452",
  appId: "1:861363544452:web:88dd1be92a234d59ad7dd1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const syncBar = document.getElementById('syncBar');

let events = {};
let selDate = null;
let selCat = 'neutral';
let dragData = null;
let editKey = null, editIdx = null, editCat = 'neutral';

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();

/* ---- Firebase ---- */
onSnapshot(doc(db, "journal", "data"), snap => {
  if (snap.exists()) {
    events = snap.data().events || {};
    Object.keys(events).forEach(k => {
      events[k] = events[k].map(e =>
        typeof e === 'string' ? { text: e, cat: 'neutral', time: null } : e
      );
    });
  } else {
    events = {};
  }
  syncBar.textContent = "Synchronisé";
  syncBar.className = "sync-bar";
  buildCalendar();
}, () => {
  syncBar.textContent = "Erreur de connexion";
  syncBar.className = "sync-bar error";
});

async function saveAll() {
  syncBar.textContent = "Sauvegarde…";
  syncBar.className = "sync-bar syncing";
  try {
    await setDoc(doc(db, "journal", "data"), { events });
    syncBar.textContent = "Synchronisé";
    syncBar.className = "sync-bar";
  } catch(e) {
    syncBar.textContent = "Erreur de sauvegarde";
    syncBar.className = "sync-bar error";
  }
}

/* ---- Month nav ---- */
window.changeMonth = function(dir) {
  viewMonth += dir;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
  buildCalendar();
};

/* ---- Calendar ---- */
function chipClass(cat) {
  if (cat === 'shame')     return 'chip-shame';
  if (cat === 'behaviour') return 'chip-behaviour';
  return 'chip-neutral';
}

function buildCalendar() {
  const y = viewYear, m = viewMonth;
  const todayD = new Date();

  document.getElementById('monthTitle').textContent =
    new Date(y, m, 1).toLocaleString('fr-FR', { month: 'long', year: 'numeric' });

  const labels = document.getElementById('dayLabels');
  labels.innerHTML = '';
  ['Lu','Ma','Me','Je','Ve','Sa','Di'].forEach(d => {
    const x = document.createElement('div');
    x.className = 'day-label'; x.textContent = d;
    labels.appendChild(x);
  });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const first = (new Date(y, m, 1).getDay() + 6) % 7;
  const total = new Date(y, m + 1, 0).getDate();

  for (let i = 0; i < first; i++) {
    const x = document.createElement('div'); x.style.minHeight = '110px'; grid.appendChild(x);
  }

  for (let d = 1; d <= total; d++) {
    const key = `${y}-${m+1}-${d}`;
    const isToday = d === todayD.getDate() && m === todayD.getMonth() && y === todayD.getFullYear();

    const div = document.createElement('div');
    div.className = 'day' + (isToday ? ' today' : '');

    div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => {
      e.preventDefault();
      div.classList.remove('drag-over');
      if (!dragData || dragData.fromKey === key) return;
      const ev = events[dragData.fromKey][dragData.index];
      events[dragData.fromKey].splice(dragData.index, 1);
      if (!events[dragData.fromKey].length) delete events[dragData.fromKey];
      if (!events[key]) events[key] = [];
      events[key].push(ev);
      dragData = null;
      buildCalendar(); saveAll();
    });

    const num = document.createElement('div');
    num.className = 'day-num'; num.textContent = d;
    div.appendChild(num);

    if (events[key]) {
      events[key].forEach((ev, i) => {
        const chip = document.createElement('div');
        chip.className = `ev-chip ${chipClass(ev.cat || 'neutral')}`;
        chip.draggable = true;

        chip.addEventListener('dragstart', e => {
          dragData = { fromKey: key, index: i };
          chip.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
        chip.addEventListener('click', e => {
          if (e.target.classList.contains('ev-del')) return;
          openEdit(key, i);
        });

        const inner = document.createElement('span');
        inner.className = 'ev-inner';
        if (ev.time) {
          const t = document.createElement('span');
          t.className = 'time'; t.textContent = ev.time;
          inner.appendChild(t);
        }
        const lbl = document.createElement('span');
        lbl.className = 'label'; lbl.textContent = ev.text;
        inner.appendChild(lbl);

        const del = document.createElement('span');
        del.className = 'ev-del'; del.textContent = '✕';
        del.onclick = e => {
          e.stopPropagation();
          events[key].splice(i, 1);
          if (!events[key].length) delete events[key];
          buildCalendar(); saveAll();
        };

        chip.appendChild(inner); chip.appendChild(del);
        div.appendChild(chip);
      });
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'add-ev-btn'; addBtn.textContent = '+ ajouter';
    addBtn.onclick = e => {
      e.stopPropagation();
      selDate = key;
      document.getElementById('evInput').value = '';
      document.getElementById('evTime').value = '';
      selectCat('neutral');
      document.getElementById('modalTitle').textContent = 'Ajouter une entrée';
      document.getElementById('overlay').style.display = 'flex';
      setTimeout(() => document.getElementById('evInput').focus(), 50);
    };
    div.appendChild(addBtn);
    grid.appendChild(div);
  }
}

/* ---- Add modal ---- */
window.selectCat = function(c) {
  selCat = c;
  ['neutral','shame','behaviour'].forEach(x =>
    document.getElementById('c-'+x).classList.toggle('selected', x === c));
};

window.saveEvent = async function() {
  const val = document.getElementById('evInput').value.trim();
  if (!val) return;
  if (!events[selDate]) events[selDate] = [];
  events[selDate].push({ text: val, cat: selCat, time: document.getElementById('evTime').value || null });
  closeModal(); buildCalendar(); await saveAll();
};

window.closeModal = function() {
  document.getElementById('overlay').style.display = 'none';
};

/* ---- Edit modal ---- */
window.openEdit = function(key, idx) {
  editKey = key; editIdx = idx;
  const ev = events[key][idx];
  document.getElementById('editEvInput').value = ev.text;
  document.getElementById('editEvTime').value = ev.time || '';
  selectEditCat(ev.cat || 'neutral');
  document.getElementById('editOverlay').style.display = 'flex';
  setTimeout(() => document.getElementById('editEvInput').focus(), 50);
};

window.selectEditCat = function(c) {
  editCat = c;
  ['neutral','shame','behaviour'].forEach(x =>
    document.getElementById('ec-'+x).classList.toggle('selected', x === c));
};

window.saveEdit = async function() {
  const val = document.getElementById('editEvInput').value.trim();
  if (!val) return;
  events[editKey][editIdx] = {
    text: val,
    cat: editCat,
    time: document.getElementById('editEvTime').value || null
  };
  closeEdit(); buildCalendar(); await saveAll();
};

window.closeEdit = function() {
  document.getElementById('editOverlay').style.display = 'none';
};

buildCalendar();
</script>
</body>
</html>
